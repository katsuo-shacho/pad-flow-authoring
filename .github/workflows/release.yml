# main に push されたら CHANGELOG.md の先頭の版（## x.y.z）を読み、その Release が無ければタグ v<版> と Release を作り、
# ポータブル版 zip を添付する。タグを手で打つ必要は無い（版を上げる＝CHANGELOG に段落を足す）。
# 最新版の固定 URL: https://github.com/<owner>/pad-flow-authoring/releases/latest/download/pad-flow-authoring-portable.zip
name: release-portable
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read version from CHANGELOG
        id: ver
        run: |
          v=$(grep -m1 -oE '^## [0-9]+\.[0-9]+\.[0-9]+' CHANGELOG.md | sed 's/## //')
          echo "tag=v$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then echo "exists=true" >> "$GITHUB_OUTPUT"; else echo "exists=false" >> "$GITHUB_OUTPUT"; fi
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
        env: { GH_TOKEN: "${{ github.token }}" }
      - name: Build portable zip
        if: steps.ver.outputs.exists == 'false'
        run: python3 scripts/make_portable.py --out "$GITHUB_WORKSPACE/pad-flow-authoring-portable.zip"
      - uses: softprops/action-gh-release@v2
        if: steps.ver.outputs.exists == 'false'
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          files: pad-flow-authoring-portable.zip
          body_path: notes.md
