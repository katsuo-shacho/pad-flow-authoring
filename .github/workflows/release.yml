# タグ v* を push すると、ポータブル版 zip を作って Release に添付する
# 最新版の固定 URL: https://github.com/<owner>/pad-flow-authoring/releases/latest/download/pad-flow-authoring-portable.zip
name: release-portable
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build portable zip
        run: python3 scripts/make_portable.py --out "$GITHUB_WORKSPACE/pad-flow-authoring-portable.zip"
      - name: Release notes from CHANGELOG
        run: |
          awk '/^## /{n++} n==1' CHANGELOG.md > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          files: pad-flow-authoring-portable.zip
          body_path: notes.md
